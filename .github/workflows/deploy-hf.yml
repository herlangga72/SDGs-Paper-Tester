# Auto-deploy to a free Hugging Face Spaces (Docker) instance on every push.
# One-time setup (see DEPLOY.md):
#   1. Create a free Space at https://huggingface.co/new-space (SDK: Docker)
#   2. Add a repo secret HF_TOKEN = a "write" token from
#      https://huggingface.co/settings/tokens
#   3. Optional: repo variable HF_SPACE_ID = "user/space-name"
#      (defaults to herlangga72/sdg-paper-matcher)
name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync repo to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          set -euo pipefail
          SPACE_ID="${HF_SPACE_ID:-herlangga72/sdg-paper-matcher}"
          if [ -z "${HF_TOKEN}" ]; then
            echo "::error::Set the HF_TOKEN secret (write token) to deploy."; exit 1
          fi

          rm -rf /tmp/space
          git clone --depth 1 "https://user:${HF_TOKEN}@huggingface.co/spaces/${SPACE_ID}" /tmp/space

          # Preserve the Space's README.md — it carries the Hugging Face
          # front matter (sdk: docker) required for Docker Spaces.
          cp /tmp/space/README.md /tmp/space-README.md 2>/dev/null || true

          rsync -a --delete --exclude .git --exclude README.md ./ /tmp/space/
          cp /tmp/space-README.md /tmp/space/README.md 2>/dev/null || true

          cd /tmp/space
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "Deploy $(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)"
            git push
            echo "Deployed to https://${SPACE_ID%%/*}-${SPACE_ID##*/}.hf.space"
          fi
