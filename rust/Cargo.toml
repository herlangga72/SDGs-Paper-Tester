[package]
name = "sdg_tools"
version = "0.2.0"
edition = "2021"
description = "Parse Scopus SDG query files, match papers against them, and serve the web app — Rust, SIMD (AVX-512/AVX2/SSE3–SSE4.2)"
license = "GPL-3.0-or-later"

# The engine (lib) is dependency-free; only the `web` binary pulls in an
# HTTP client (for the Crossref DOI lookup), JSON support, and gzip
# response compression (pure-Rust backend, no C build step).
[dependencies]
ureq = "3"
memmap2 = "0.9"
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sha2 = { version = "0.10", default-features = false }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { version = "0.7.15", optional = true }

[profile.release]
opt-level = 3
# Share faster release settings between local and Docker builds.
lto = "thin"
codegen-units = 16
# Strip debug symbols for smaller deployment images.
strip = "symbols"

# Original optimization settings for runtime benchmarking and final tuning.
# Build with cargo build --profile release-max (target/release-max/).
[profile.release-max]
inherits = "release"
lto = true
codegen-units = 1

[features]
# Linux connection acceptance backend. Runtime setup is probed; failure falls back.
io-uring = ["dep:io-uring"]
# Dev-only: counting instrumentation + experiment toggles for latency tuning.
# Run: cargo run --release --features prof --example prof -- <paper.md> [iters]
prof = []
