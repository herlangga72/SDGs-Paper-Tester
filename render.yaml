# Render Blueprint — one-click free-tier deployment.
# Usage: render.com → New → Blueprint → select this GitHub repo.
# (Or: New → Web Service → connect repo → runtime Docker → plan Free.)
# Free tier: no credit card, sleeps after 15 min idle, ~750 free hours/month.
services:
  - type: web
    name: sdg-paper-matcher
    runtime: docker
    repo: https://github.com/herlangga72/SDGs-Paper-Tester
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      # Optional error reporting (Sentry). The DSN is a public client key by
      # design; events are only sent while this variable is set. To keep it out
      # of the repo, delete the two lines below and set SENTRY_DSN as a Render
      # dashboard env var instead.
      - key: SENTRY_DSN
        value: https://b7a8b16ab31f6a94ee2944534183f03e@o4512018920439808.ingest.us.sentry.io/4512018935447552
      - key: SENTRY_ENV
        value: production
